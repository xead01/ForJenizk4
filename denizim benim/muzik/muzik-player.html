<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müzik Çalar</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <audio id="background-music" loop>
        <source src="arkaplan-muzik.mp3" type="audio/mpeg">
        Tarayıcınız audio elementini desteklemiyor.
    </audio>

    <script>
        // Müzik oynatıcı
        const backgroundMusic = document.getElementById('background-music');
        
        // Ana pencereden mesaj dinleme
        window.addEventListener('message', function(event) {
            // Güvenlik kontrolü
            if (event.origin !== window.location.origin) return;
            
            const command = event.data;
            
            if (command === 'play') {
                backgroundMusic.play().catch(e => console.log("Oynatma hatası:", e));
            } else if (command === 'pause') {
                backgroundMusic.pause();
            } else if (command === 'toggle') {
                if (backgroundMusic.paused) {
                    backgroundMusic.play().catch(e => console.log("Oynatma hatası:", e));
                } else {
                    backgroundMusic.pause();
                }
            }
        });
        
        // Sayfa yüklendiğinde müzik durumunu kontrol et
        window.addEventListener('load', function() {
            const isMusicPlaying = localStorage.getItem('isMusicPlaying') === 'true';
            if (isMusicPlaying) {
                backgroundMusic.play().catch(e => console.log("Otomatik oynatma engellendi:", e));
            }
        });
    </script>
</body>
</html>
