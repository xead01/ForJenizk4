<!DOCTYPE html>
<html lang="tr" style="overflow-y: scroll;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="muzik.js"></script>
    <style>
        .success-message {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: #e75480;
            text-align: center;
            margin: 40px 0;
            animation: glow 1.5s ease-in-out infinite alternate;
        }
        
        .heart-animation {
            width: 100px;
            height: 100px;
            background: #e75480;
            position: relative;
            transform: rotate(45deg);
            margin: 50px auto;
            animation: heartbeat 1.5s ease-in-out infinite;
        }
        
        .heart-animation:before,
        .heart-animation:after {
            content: "";
            width: 100px;
            height: 100px;
            background: #e75480;
            border-radius: 50%;
            position: absolute;
        }
        
        .heart-animation:before {
            top: -50px;
            left: 0;
        }
        
        .heart-animation:after {
            top: 0;
            left: -50px;
        }
        
        @keyframes heartbeat {
            0% { transform: rotate(45deg) scale(0.8); }
            5% { transform: rotate(45deg) scale(0.9); }
            10% { transform: rotate(45deg) scale(0.8); }
            15% { transform: rotate(45deg) scale(1); }
            50% { transform: rotate(45deg) scale(0.8); }
            100% { transform: rotate(45deg) scale(0.8); }
        }
        
        @keyframes glow {
            from {
                text-shadow: 0 0 5px rgba(231, 84, 128, 0.3);
            }
            to {
                text-shadow: 0 0 15px rgba(231, 84, 128, 0.7);
            }
        }
        
        .love-message {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #555;
            margin: 30px 0;
            text-align: center;
        }
    </style>
</head>
<body class="allow-scroll">
    <!-- Ördek animasyonu -->
    <div class="duck"></div>
    <div class="duck"></div>
    <div class="duck"></div>
    <div class="duck"></div>
    <div class="duck"></div>
    
    <div class="container">
        <div class="card">
            <div class="heart-animation"></div>
            <h1 class="success-message">Teşekkür ederim!</h1>
            <p class="love-message">
                Seni çok seviyorum. Bu kararın beni çok mutlu etti. Şimdi yeni bir başlangıç yapabiliriz.    
            </p>
            <p class="love-message">
                Hayatımın en güzel anlarını seninle yaşadım ve daha nice güzel anılar biriktireceğiz.
                Seni her zaman seveceğim.
            </p>
            <p class="love-message">
                Hadi Yaz Bana Denom.
            </p>
            <div class="buttons">
                <a href="index.html" class="btn">Başa Dön</a>
            </div>
        </div>
    </div>
    
    <!-- Arka plan müziği -->
    <audio id="background-music" preload="auto" loop>
        <source src="muzik/arkaplan-muzik.mp3" type="audio/mpeg">
        Tarayıcınız audio elementini desteklemiyor.
    </audio>
    
    <!-- Müzik kontrol butonu -->
    <div class="music-controls" id="music-toggle">
        <svg class="music-icon" id="music-on" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 18V6L21 3V15" stroke="#e75480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M6 21C7.65685 21 9 19.6569 9 18C9 16.3431 7.65685 15 6 15C4.34315 15 3 16.3431 3 18C3 19.6569 4.34315 21 6 21Z" stroke="#e75480" stroke-width="2"/>
            <path d="M18 18C19.6569 18 21 16.6569 21 15C21 13.3431 19.6569 12 18 12C16.3431 12 15 13.3431 15 15C15 16.6569 16.3431 18 18 18Z" stroke="#e75480" stroke-width="2"/>
        </svg>
        <svg class="music-icon" id="music-off" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: none;">
            <path d="M9 18V6L21 3V15" stroke="#e75480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M6 21C7.65685 21 9 19.6569 9 18C9 16.3431 7.65685 15 6 15C4.34315 15 3 16.3431 3 18C3 19.6569 4.34315 21 6 21Z" stroke="#e75480" stroke-width="2"/>
            <path d="M18 18C19.6569 18 21 16.6569 21 15C21 13.3431 19.6569 12 18 12C16.3431 12 15 13.3431 15 15C15 16.6569 16.3431 18 18 18Z" stroke="#e75480" stroke-width="2"/>
            <path d="M2 2L22 22" stroke="#e75480" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </div>
    
    <div class="hearts">
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
    </div>
    
    <script>
        // Sayfa yüklendiğinde müzik pozisyonunu ayarla
        document.addEventListener('DOMContentLoaded', function() {
            // Son bilinen müzik pozisyonunu al
            const lastPosition = parseFloat(localStorage.getItem('lastMusicPosition') || '0');
            
            if (lastPosition > 0) {
                const audio = document.getElementById('background-music');
                if (audio) {
                    // Müzik yüklendiğinde pozisyonu ayarla
                    audio.addEventListener('loadedmetadata', function() {
                        try {
                            audio.currentTime = lastPosition;
                            console.log("Son müzik pozisyonu ayarlandı:", lastPosition);
                        } catch (e) {
                            console.log("Müzik pozisyonu ayarlama hatası:", e);
                        }
                    });
                }
            }
        });
    </script>
</body>
</html>
