<!DOCTYPE html>
<html lang="tr" class="no-scroll">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .typewriter-container {
            display: inline-flex;
            align-items: center;
        }
        
        .typewriter-static {
            margin-right: 10px;
        }
        
        .typewriter-dynamic {
            position: relative;
            color: #e75480;
        }
        
        .typewriter-dynamic::after {
            content: "";
            position: absolute;
            right: -5px;
            top: 0;
            height: 100%;
            width: 3px;
            background-color: #e75480;
            animation: blink 0.7s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
    <script src="muzik.js"></script>
</head>
<body class="no-scroll">
    <!-- Ördek animasyonu -->
    <div class="duck"></div>
    <div class="duck"></div>
    <div class="duck"></div>
    <div class="duck"></div>
    <div class="duck"></div>
    
    <div class="container">
        <div class="card">
            <h1 class="typewriter-container">
                <span class="typewriter-static">Merhaba</span>
                <span class="typewriter-dynamic" id="dynamic-text"></span>
            </h1>
            <p class="message">Biliyorum, şu an her şey karışık… ama lutfen sonuna kadar oku.</p>
            <a href="sayfa2.html" class="btn">Devam Et</a>
        </div>
    </div>
    <div class="hearts">
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
    </div>
    
    <!-- Arka plan müziği -->
    <audio id="background-music" loop>
        <source src="muzik/arkaplan-muzik.mp3" type="audio/mpeg">
        Tarayıcınız audio elementini desteklemiyor.
    </audio>
    
    <!-- Müzik kontrol butonu -->
    <div class="music-controls" id="music-toggle">
        <svg class="music-icon" id="music-on" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 18V6L21 3V15" stroke="#e75480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M6 21C7.65685 21 9 19.6569 9 18C9 16.3431 7.65685 15 6 15C4.34315 15 3 16.3431 3 18C3 19.6569 4.34315 21 6 21Z" stroke="#e75480" stroke-width="2"/>
            <path d="M18 18C19.6569 18 21 16.6569 21 15C21 13.3431 19.6569 12 18 12C16.3431 12 15 13.3431 15 15C15 16.6569 16.3431 18 18 18Z" stroke="#e75480" stroke-width="2"/>
        </svg>
        <svg class="music-icon" id="music-off" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: none;">
            <path d="M9 18V6L21 3V15" stroke="#e75480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M6 21C7.65685 21 9 19.6569 9 18C9 16.3431 7.65685 15 6 15C4.34315 15 3 16.3431 3 18C3 19.6569 4.34315 21 6 21Z" stroke="#e75480" stroke-width="2"/>
            <path d="M18 18C19.6569 18 21 16.6569 21 15C21 13.3431 19.6569 12 18 12C16.3431 12 15 13.3431 15 15C15 16.6569 16.3431 18 18 18Z" stroke="#e75480" stroke-width="2"/>
            <path d="M2 2L22 22" stroke="#e75480" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dynamicText = document.getElementById('dynamic-text');
            const words = ["Denom", "Bitanem", "Denizim", "Balım", "Zirto", "Aşkım"];
            let wordIndex = 0;
            let charIndex = 0;
            let isDeleting = false;
            let typingDelay = 100;  
            let deletingDelay = 50; 
            let newWordDelay = 1000; 

            function type() {
                const currentWord = words[wordIndex];
                
                if (isDeleting) {
                    dynamicText.textContent = currentWord.substring(0, charIndex - 1);
                    charIndex--;
                    typingDelay = deletingDelay;
                } else {
                    dynamicText.textContent = currentWord.substring(0, charIndex + 1);
                    charIndex++;
                    typingDelay = 100; 
                }
                
                if (!isDeleting && charIndex === currentWord.length) {
                    typingDelay = newWordDelay;
                    isDeleting = true;
                } else if (isDeleting && charIndex === 0) {
                    isDeleting = false;
                    wordIndex = (wordIndex + 1) % words.length;
                }
                
                setTimeout(type, typingDelay);
            }
            
            setTimeout(type, 500);
        });
    </script>
</body>
</html>
